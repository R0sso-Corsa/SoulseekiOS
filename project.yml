name: SoulseekiOS
options:
  bundleIdPrefix: com.ericparonikyan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  SoulseekiOS:
    path: .
schemes:
  SoulseekiOS:
    build:
      targets:
        SoulseekiOS: all
        SoulseekiOSUITests: [test]
    run:
      config: Debug
    test:
      targets:
        - SoulseekiOSUITests
    archive:
      config: Release
targets:
  SoulseekiOS:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: SoulseekiOS
        product: SoulseekProtocol
      - package: SoulseekiOS
        product: SoulseekCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericparonikyan.soulseekios
        PRODUCT_NAME: SoulseekiOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SoulseekiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: SoulseekiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"